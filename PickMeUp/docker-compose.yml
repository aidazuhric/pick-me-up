services:
  pickmeup-db:
    image: postgres:16.4
    container_name: pickmeup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pickmeup

  pickmeup-rabbitmq:
    image: rabbitmq:3.13-management
    container_name: pickmeup-rabbitmq
    hostname: pickmeup-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
      RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE}
      RABBITMQ_NODENAME: rabbit@pickmeup-rabbitmq
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
      RABBITMQ_CTL_ERL_ARGS: "+S 2:2 +sbwt none +sbwtdcpu none +sbwtdio none"
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "bash", "-c", "cat < /dev/null > /dev/tcp/127.0.0.1/5672"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 900s
    networks:
      - pickmeup

  pickmeup-mailpit:
    image: axllent/mailpit:v1.21.8
    container_name: pickmeup-mailpit
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      pickmeup:
        aliases:
          - mailpit

  pickmeup-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pickmeup-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=pickmeup-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      RABBITMQ_HOST: pickmeup-rabbitmq
    ports:
      - "5121:5121"
    depends_on:
      pickmeup-db:
        condition: service_healthy
      pickmeup-rabbitmq:
        condition: service_healthy
    networks:
      - pickmeup

  pickmeup-worker:
    build:
      context: .
      dockerfile: Dockerfile.Worker
    container_name: pickmeup-worker
    env_file:
      - .env
    environment:
      DOTNET_ENVIRONMENT: Development
      RABBITMQ_HOST: pickmeup-rabbitmq
    depends_on:
      pickmeup-rabbitmq:
        condition: service_healthy
      pickmeup-mailpit:
        condition: service_started
    networks:
      - pickmeup

volumes:
  postgres_data:
  rabbitmq_data:

networks:
  pickmeup:
    driver: bridge
