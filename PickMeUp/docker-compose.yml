services:
  pickmeup-db:
    image: postgres:16.4
    container_name: pickmeup-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - pickmeup

  pickmeup-api:
    build:
      context: .
    container_name: pickmeup-api
    env_file:
      - .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      DATABASE_CONNECTION_STRING: Host=pickmeup-db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    ports:
      - "5121:5121"
    depends_on:
      pickmeup-db:
        condition: service_healthy
    networks:
      - pickmeup

volumes:
  postgres_data:

networks:
  pickmeup:
    driver: bridge
